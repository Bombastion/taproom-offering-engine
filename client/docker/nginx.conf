server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Caddy, redirects must stay relative so they keep the public https host
    absolute_redirect off;

    location = /admin {
        return 301 /admin/;
    }

    # Hashed build output never changes, so it can be cached for good
    location /admin/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else under /admin/ is the single-page app: serve the file if it exists,
    # otherwise index.html so deep links like /admin/menus/<id> work on reload
    location /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /admin/index.html;
    }

    location / {
        return 404;
    }
}
