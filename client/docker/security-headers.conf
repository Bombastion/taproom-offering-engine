# Included in each location (nginx drops server-level add_header lines in any location that
# sets its own). The app loads nothing from other origins: fonts are bundled, and the only
# network calls are to the same-origin /api.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
