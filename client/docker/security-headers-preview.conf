# For preview-frame.html only: the page the designer draws the print menu into.
# The page is sandboxed (scripts allowed, but no access to the app's cookies or storage, and no
# forms, popups or navigation of the app). The print menu it is handed carries its own inline style
# and script, so those are allowed here, and nothing else: no network except the menu's own fonts.
add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
